[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        - **({{commit.scope}})** {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}\
        {% if commit.github.pr_number %} ([#{{ commit.github.pr_number }}]({{ commit.github.pr_number | get_pr_url }}))\
        {% elif commit.links %} ({{ commit.links | first }})\
        {% endif %}
    {%- endfor -%}
    {% raw %}\n{% endraw %}\
    {%- for commit in commits %}
        {%- if commit.scope -%}
        {% else -%}
            - {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}\
            {% if commit.github.pr_number %} ([#{{ commit.github.pr_number }}]({{ commit.github.pr_number | get_pr_url }}))\
            {% elif commit.links %} ({{ commit.links | first }})\
            {% endif %}
        {% endif -%}
    {% endfor -%}
{% endfor %}\n
"""
footer = """
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/sdsc-ordes/open-pulse-ontology/issues/${2}))" },
]

commit_parsers = [
  { message = "^chore\\(release\\): update changelog", skip = true },
  { message = "^chore: promote to production", skip = true },
  { message = "^chore: prepare release", skip = true },
  { message = "(?i)^(chore|ci)(\\([^)]*\\))?: .*(trigger|re-?generate).*", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore|^ci", group = "Miscellaneous Tasks" },
  { body = ".*security", group = "Security" },
  { message = "^revert", group = "Revert" },
]

protect_breaking_commits = true
filter_commits = false

# ESCAPED DOTS: Matches v1.2.3 and v1.2.3-develop specifically
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?"

topo_order = false
sort_commits = "oldest"

[remote.github]
owner = "sdsc-ordes"
repo = "open-pulse-ontology"