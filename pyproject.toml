[project]
name = "open-pulse-ontology"
version = "2.1.0"
description = "An RDF ontology for modeling contributions to open source scientific software and research articles from EPFL"
readme = { file = "README", content-type = "text/markdown" }
license = { text = "CC-BY-4.0" }
requires-python = ">=3.9"
keywords = ["ontology", "rdf", "shacl", "semantic-web", "epfl"]
authors = [
    { name = "SDSC ORDES", email = "ordes@sdsc.ch" }
]

dependencies = [
    "rdflib>=6.0.0",
    "pyshacl>=0.20.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Repository = "https://github.com/sdsc-ordes/open-pulse-ontology"

[tool.hatch.build.targets.wheel]
packages = []

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W"]
ignore = ["E501"]  # line-too-long (handled by black)

[tool.pytest.ini_options]
testpaths = ["tools/python/checks"]
python_files = "test_*.py"

[tool.git-cliff.changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        - **({{commit.scope}})** {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}\
        {% if commit.github.pr_number %} ([#{{ commit.github.pr_number }}]({{ commit.github.pr_number | get_pr_url }}))\
        {% elif commit.links %} ({{ commit.links | first }})\
        {% endif %}
    {%- endfor -%}
    {% raw %}\n{% endraw %}\
    {%- for commit in commits %}
        {%- if commit.scope -%}
        {% else -%}
            - {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}\
            {% if commit.github.pr_number %} ([#{{ commit.github.pr_number }}]({{ commit.github.pr_number | get_pr_url }}))\
            {% elif commit.links %} ({{ commit.links | first }})\
            {% endif %}
        {% endif -%}
    {% endfor -%}
{% endfor %}\n
"""
footer = """
"""
trim = true

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/sdsc-ordes/open-pulse-ontology/issues/${2}))" },
]

commit_parsers = [
  { message = "^chore\\(release\\): update changelog", skip = true },
  { message = "^chore: promote to production", skip = true },
  { message = "^chore: prepare release", skip = true },
  { message = "(?i)^(chore|ci)(\\([^)]*\\))?: .*(trigger|re-?generate).*", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore|^ci", group = "Miscellaneous Tasks" },
  { body = ".*security", group = "Security" },
  { message = "^revert", group = "Revert" },
]

protect_breaking_commits = true
filter_commits = false

# ESCAPED DOTS: Matches v1.2.3 and v1.2.3-develop specifically
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?"

topo_order = false
sort_commits = "oldest"

[tool.git-cliff.remote.github]
owner = "sdsc-ordes"
repo = "open-pulse-ontology"
