<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Pulse Ontology</title>
  <script>
    // Dynamically resolve and load header assets regardless of directory depth
    (function() {
      var path = window.location.pathname;
      var match = path.match(/^(.*?)\/(branches|versions)\//);
      var basePath = match ? match[1] : '';

      // Load header CSS
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = basePath + '/assets/version-header.css';
      document.head.appendChild(link);

      // Load header JS
      var script = document.createElement('script');
      script.src = basePath + '/assets/version-header.js';
      script.defer = true;
      document.head.appendChild(script);
    })();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    #doc-frame {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      border: none;
      /* Default: full viewport, adjusted by script once header loads */
      top: 0;
    }
  </style>
</head>
<body>
  <iframe id="doc-frame" src="doc.html" title="Documentation"></iframe>
  <script>
    // Once the header is injected, push the iframe below it
    var observer = new MutationObserver(function() {
      var header = document.querySelector('.version-header');
      if (header) {
        var headerHeight = header.offsetHeight;
        var commitNav = document.querySelector('.commit-nav');
        if (commitNav) headerHeight += commitNav.offsetHeight;
        document.getElementById('doc-frame').style.top = headerHeight + 'px';
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
