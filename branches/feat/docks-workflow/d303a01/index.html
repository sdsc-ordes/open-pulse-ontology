<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Pulse Ontology</title>
  <script>
    // Dynamically resolve and load header assets regardless of directory depth
    (function() {
      var path = window.location.pathname;
      var match = path.match(/^(.*?)\/(branches|versions)\//);
      var basePath = match ? match[1] : '';

      // Load header CSS
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = basePath + '/assets/version-header.css';
      document.head.appendChild(link);

      // Load header JS
      var script = document.createElement('script');
      script.src = basePath + '/assets/version-header.js';
      script.defer = true;
      document.head.appendChild(script);
    })();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      padding-top: 0 !important; /* Override version-header.js inline padding */
    }
    #doc-frame {
      flex: 1;
      width: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="doc-frame" src="doc.html" title="Documentation"></iframe>
</body>
</html>
