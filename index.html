<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Pulse Ontology - Documentation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .container {
      text-align: center;
      padding: 40px;
      max-width: 600px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.8);
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #64b5f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .fallback {
      display: none;
      margin-top: 2rem;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
    }

    .fallback h2 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      color: #ff9800;
    }

    .fallback p {
      margin-bottom: 1rem;
      color: rgba(255, 255, 255, 0.8);
    }

    .version-list {
      list-style: none;
      margin-top: 1rem;
    }

    .version-list li {
      margin: 8px 0;
    }

    .version-list a {
      color: #64b5f6;
      text-decoration: none;
      padding: 8px 16px;
      display: inline-block;
      border: 1px solid rgba(100, 181, 246, 0.3);
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .version-list a:hover {
      background: rgba(100, 181, 246, 0.1);
      border-color: #64b5f6;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      border-radius: 3px;
      margin-left: 8px;
    }

    .badge.release {
      background: #9c27b0;
      color: white;
    }

    .badge.latest {
      background: #4caf50;
      color: white;
    }

    .badge.branch {
      background: #607d8b;
      color: white;
    }

    noscript {
      display: block;
      padding: 20px;
      background: rgba(255, 152, 0, 0.2);
      border-radius: 8px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Open Pulse Ontology</h1>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span>Loading documentation...</span>
    </div>
    <div class="fallback" id="fallback">
      <h2>Select a Version</h2>
      <p>Choose a version to view the documentation:</p>
      <ul class="version-list" id="version-list"></ul>
    </div>
    <noscript>
      <p>JavaScript is required to automatically redirect to the documentation.</p>
      <p>Please enable JavaScript or navigate to a specific version manually.</p>
    </noscript>
  </div>

  <script>
    (async function() {
      const CONFIG_PATH = './config.json';
      const VERSIONS_PATH = './versions.json';

      async function fetchJSON(url) {
        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return await response.json();
        } catch (error) {
          console.error(`Failed to fetch ${url}:`, error);
          return null;
        }
      }

      function getReleasePath(tag) {
        return `./versions/${tag}/index.html`;
      }

      function getBranchCommitPath(branch, commit) {
        return `./branches/${branch}/${commit}/index.html`;
      }

      function showFallback(releases, branches, latestRelease) {
        document.getElementById('loading').style.display = 'none';
        const fallbackDiv = document.getElementById('fallback');
        fallbackDiv.style.display = 'block';

        const list = document.getElementById('version-list');

        // Add releases
        if (releases && releases.length > 0) {
          releases.forEach(release => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = getReleasePath(release.tag);
            a.textContent = release.tag;
            
            if (release.tag === latestRelease) {
              const badge = document.createElement('span');
              badge.className = 'badge latest';
              badge.textContent = 'latest';
              a.appendChild(badge);
            } else {
              const badge = document.createElement('span');
              badge.className = 'badge release';
              badge.textContent = 'release';
              a.appendChild(badge);
            }
            
            li.appendChild(a);
            list.appendChild(li);
          });
        }

        // Add priority branches
        if (branches) {
          const priorityBranches = ['main', 'develop'];
          priorityBranches.forEach(branchName => {
            if (branches[branchName] && branches[branchName].commits.length > 0) {
              const latestCommit = branches[branchName].commits[0];
              const li = document.createElement('li');
              const a = document.createElement('a');
              a.href = getBranchCommitPath(branchName, latestCommit.hash);
              a.textContent = branchName;
              
              const badge = document.createElement('span');
              badge.className = 'badge branch';
              badge.textContent = 'dev';
              a.appendChild(badge);
              
              li.appendChild(a);
              list.appendChild(li);
            }
          });
        }
      }

      function redirect(path) {
        window.location.href = path;
      }

      // Load configuration and versions
      const [config, versionsData] = await Promise.all([
        fetchJSON(CONFIG_PATH),
        fetchJSON(VERSIONS_PATH)
      ]);

      if (!config || !versionsData) {
        showFallback([], {}, null);
        return;
      }

      const { releases, branches, latestRelease } = versionsData;

      if ((!releases || releases.length === 0) && (!branches || Object.keys(branches).length === 0)) {
        showFallback([], {}, null);
        return;
      }

      // Determine default version based on config
      let targetPath = null;

      if (config.defaultVersion === 'latest-release' && latestRelease) {
        const release = releases.find(r => r.tag === latestRelease);
        if (release) {
          targetPath = getReleasePath(release.tag);
        }
      } else if (config.defaultVersion && config.defaultVersion !== 'latest-release') {
        // Check if it's a specific tag
        const release = releases.find(r => r.tag === config.defaultVersion);
        if (release) {
          targetPath = getReleasePath(release.tag);
        } else if (branches[config.defaultVersion]) {
          // It's a branch name
          const branch = branches[config.defaultVersion];
          if (branch.commits.length > 0) {
            targetPath = getBranchCommitPath(config.defaultVersion, branch.commits[0].hash);
          }
        }
      }

      // Fallback: latest release, then main branch
      if (!targetPath && latestRelease) {
        const release = releases.find(r => r.tag === latestRelease);
        if (release) {
          targetPath = getReleasePath(release.tag);
        }
      }

      if (!targetPath && branches.main && branches.main.commits.length > 0) {
        targetPath = getBranchCommitPath('main', branches.main.commits[0].hash);
      }

      if (!targetPath && releases.length > 0) {
        targetPath = getReleasePath(releases[0].tag);
      }

      if (targetPath) {
        redirect(targetPath);
      } else {
        showFallback(releases, branches, latestRelease);
      }
    })();
  </script>
</body>
</html>
