name: SHACL Documentation Generation Versioned

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build docs from (leave empty for current)"
        required: false
        default: ""
  push:
    branches:
      - "**"
      - "!docs" # Exclude docs branch to prevent loops
    paths:
      - "src/ontology/ontology-combined.ttl"
      - "src/ontology/ontology-definitions.ttl"
      - "src/ontology/ontology-enumerations.ttl"
      - "src/ontology/ontology-shapes.ttl"
      - "src/ontology/ontology-combined-verbose.ttl"
      - "src/ontology/ontology-definitions-verbose.ttl"
      - "src/ontology/ontology-enumerations-verbose.ttl"
      - "src/ontology/ontology-shapes-verbose.ttl"
  # Tag pushes can't share this trigger: GitHub's `paths:` filter applies to
  # both branches and tags, and for merge-commit tags it silently drops
  # everything — that's why v2.1.0/v2.1.2 never reached versions.json.
  # Hook into the release event instead, which `publish-release.yml` fires
  # via `gh release create --latest`. No paths filter applies here.
  release:
    types: [published]

permissions:
  contents: write

env:
  DOCS_BRANCH: docs

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    outputs:
      version_type: ${{ steps.version-info.outputs.type }}
      version_name: ${{ steps.version-info.outputs.name }}
      commit_hash: ${{ steps.version-info.outputs.commit }}
      commit_date: ${{ steps.version-info.outputs.date }}
      commit_author: ${{ steps.version-info.outputs.author }}
      commit_message: ${{ steps.version-info.outputs.message }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Determine version info
        id: version-info
        run: |
          COMMIT_HASH=$(git rev-parse --short=7 HEAD)
          COMMIT_DATE=$(git log -1 --format=%cs)
          COMMIT_AUTHOR=$(git log -1 --format=%an)
          COMMIT_MESSAGE=$(git log -1 --format=%s | head -c 100 | sed 's/"/\\"/g')

          # Source of truth for the ref we're documenting:
          # - workflow_dispatch with `ref` input → use that input
          # - release event → use the release tag
          # - push event → use github.ref_name
          # Without this, dispatching with `ref: v2.1.2` was being recorded
          # as a branch deploy of `develop` because `github.ref` is the
          # workflow's *launching* ref, not the checked-out ref.
          INPUT_REF="${{ github.event.inputs.ref }}"
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          if [ -n "$INPUT_REF" ]; then
            REF_NAME="$INPUT_REF"
          elif [ -n "$RELEASE_TAG" ]; then
            REF_NAME="$RELEASE_TAG"
          else
            REF_NAME="${{ github.ref_name }}"
          fi

          # A name resolves to a release iff git has a tag with that name.
          # Branches that happen to share a tag name (rare) lose to the tag.
          if git show-ref --tags --quiet --verify -- "refs/tags/$REF_NAME"; then
            VERSION_TYPE="release"
          else
            VERSION_TYPE="branch"
          fi
          VERSION_NAME="$REF_NAME"
          
          echo "type=$VERSION_TYPE" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "date=$COMMIT_DATE" >> $GITHUB_OUTPUT
          echo "author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT
          echo "message=$COMMIT_MESSAGE" >> $GITHUB_OUTPUT
          
          echo "----------------------------------------"
          echo "Version type: $VERSION_TYPE"
          echo "Version name: $VERSION_NAME"
          echo "Commit hash: $COMMIT_HASH"
          echo "Commit date: $COMMIT_DATE"
          echo "Commit author: $COMMIT_AUTHOR"
          echo "Commit message: $COMMIT_MESSAGE"
          echo "----------------------------------------"
      - name: Install uv
        # Node-runtime sweep: v6 was Node 20 (deprecated alongside v2's
        # Node 16); v7 moved to Node 24. setup-uv stops publishing
        # floating major tags from v8 onward, so v7 is the safest
        # mutable pin that still gets a Node 24 runtime.
        uses: astral-sh/setup-uv@v7
      - name: Set up Python and install dependencies
        run: |
          uv sync --frozen

      - name: Run SHACL validation test suite
        run: |
          uv run python tools/python/checks/test_validation.py

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Set DOT_PATH environment variable
        run: echo "GRAPHVIZ_DOT=/usr/bin/dot" >> $GITHUB_ENV

      - name: Download SHACL Play CLI
        run: |
          wget https://github.com/sparna-git/shacl-play/releases/download/0.11.4/shacl-play-app-0.11.4-onejar.jar -O shacl-play-cli.jar

      - name: Generate Documentation
        run: |
          mkdir -p generated-docs generated-docs/verbose
          java -jar shacl-play-cli.jar \
            doc \
            -d \
            -i src/ontology/ontology-combined.ttl \
            -l en \
            -o generated-docs/index.html
          java -jar shacl-play-cli.jar \
            doc \
            -d \
            -i src/ontology/ontology-combined-verbose.ttl \
            -l en \
            -o generated-docs/verbose/index.html

      - name: Generate Ontology Diagram
        run: |
          java -jar shacl-play-cli.jar \
            draw \
            -i src/ontology/ontology-combined.ttl \
            -o generated-docs/ontology.svg
          java -jar shacl-play-cli.jar \
            draw \
            -i src/ontology/ontology-combined-verbose.ttl \
            -o generated-docs/verbose/ontology.svg

      - name: Fix SVG namespace issue
        run: |
          sed -i 's/ xmlns=""//g' generated-docs/ontology.svg generated-docs/index.html generated-docs/verbose/ontology.svg generated-docs/verbose/index.html
          # Remove XML declaration from inline SVG (breaks HTML rendering)
          sed -i 's/<?xml version="1.0" encoding="us-ascii" standalone="no"?>//g' generated-docs/index.html generated-docs/verbose/index.html

      - name: Inject Enumerations into HTML
        run: |
          uv run tools/python/docs/inject_enumerations.py src/ontology/ontology-combined.ttl generated-docs/index.html
          uv run tools/python/docs/inject_enumerations.py src/ontology/ontology-combined-verbose.ttl generated-docs/verbose/index.html

      - name: Upload generated documentation as artifact
        uses: actions/upload-artifact@v6
        with:
          name: shacl-documentation
          path: generated-docs/
          retention-days: 7

  deploy-docs:
    name: Deploy to Docs Branch
    needs: generate-docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout docs branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DOCS_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure on docs branch
        run: |
          git checkout ${{ env.DOCS_BRANCH }} || git checkout -b ${{ env.DOCS_BRANCH }}
          git pull origin ${{ env.DOCS_BRANCH }} --rebase || true
          echo "Current branch: $(git branch --show-current)"

      - name: Download generated docs
        uses: actions/download-artifact@v6
        with:
          name: shacl-documentation
          path: generated-docs

      - name: Determine target folder
        id: target
        run: |
          VERSION_TYPE="${{ needs.generate-docs.outputs.version_type }}"
          VERSION_NAME="${{ needs.generate-docs.outputs.version_name }}"
          COMMIT_HASH="${{ needs.generate-docs.outputs.commit_hash }}"
          
          if [ "$VERSION_TYPE" == "release" ]; then
            TARGET_PATH="versions/$VERSION_NAME"
          else
            TARGET_PATH="branches/$VERSION_NAME/$COMMIT_HASH"
          fi
          
          echo "path=$TARGET_PATH" >> $GITHUB_OUTPUT
          
          echo "----------------------------------------"
          echo "Target path: $TARGET_PATH"
          echo "----------------------------------------"

      - name: Copy docs to target folder
        run: |
          TARGET_PATH="${{ steps.target.outputs.path }}"
          
          mkdir -p "$TARGET_PATH"

          cp -r generated-docs/* "$TARGET_PATH/"

          # Rename generated index.html to doc.html and use the header wrapper as index.html
          # The wrapper dynamically resolves asset paths at runtime, so it works at any
          # directory depth (including branch names with slashes like feat/my-feature).
          if [ -f "$TARGET_PATH/index.html" ]; then
            mv "$TARGET_PATH/index.html" "$TARGET_PATH/doc.html"
            cp assets/index-header.html "$TARGET_PATH/index.html"
            echo "Wrapper index.html placed, generated docs renamed to doc.html"
          fi

          if [ -f "$TARGET_PATH/verbose/index.html" ]; then
            mv "$TARGET_PATH/verbose/index.html" "$TARGET_PATH/verbose/doc.html"
            cp assets/index-header.html "$TARGET_PATH/verbose/index.html"
            echo "Wrapper index.html placed for verbose docs, renamed to doc.html"
          fi

          rm -rf generated-docs
          
          echo "Files deployed to $TARGET_PATH:"
          ls -la "$TARGET_PATH/"

      - name: Update versions.json
        run: |
          VERSION_TYPE="${{ needs.generate-docs.outputs.version_type }}"
          VERSION_NAME="${{ needs.generate-docs.outputs.version_name }}"
          COMMIT_HASH="${{ needs.generate-docs.outputs.commit_hash }}"
          COMMIT_DATE="${{ needs.generate-docs.outputs.commit_date }}"
          COMMIT_AUTHOR="${{ needs.generate-docs.outputs.commit_author }}"
          COMMIT_MESSAGE="${{ needs.generate-docs.outputs.commit_message }}"
          
          if [ ! -f "versions.json" ]; then
            echo "Creating new versions.json"
            echo '{"releases":[],"branches":{},"latestRelease":null,"priorityBranches":["main","develop"]}' > versions.json
          fi

          export VERSION_TYPE VERSION_NAME COMMIT_HASH COMMIT_DATE COMMIT_AUTHOR COMMIT_MESSAGE

          python3 << 'PYTHON_SCRIPT'
          import json
          import os
          
          version_type = os.environ.get('VERSION_TYPE', '')
          version_name = os.environ.get('VERSION_NAME', '')
          commit_hash = os.environ.get('COMMIT_HASH', '')
          commit_date = os.environ.get('COMMIT_DATE', '')
          commit_author = os.environ.get('COMMIT_AUTHOR', '')
          commit_message = os.environ.get('COMMIT_MESSAGE', '')[:100]
          
          print(f"Updating versions.json for {version_type}: {version_name} @ {commit_hash}")
          
          with open('versions.json', 'r') as f:
              data = json.load(f)
          
          if version_type == "release":
              releases = data.get('releases', [])
              
              release_entry = {
                  'tag': version_name,
                  'path': f'/versions/{version_name}/',
                  'date': commit_date,
                  'commit': commit_hash,
                  'author': commit_author,
                  'message': commit_message
              }
              
              # Check if release already exists
              existing_idx = next((i for i, r in enumerate(releases) if r['tag'] == version_name), None)
              
              if existing_idx is not None:
                  releases[existing_idx] = release_entry
                  print(f"Updated existing release: {version_name}")
              else:
                  releases.append(release_entry)
                  print(f"Added new release: {version_name}")
              
              data['releases'] = releases
              
              # Update latestRelease (compare semver). Pre-release tags
              # (anything with `-` after the version, e.g. v2.1.0-develop or
              # v2.1.0-rc1) never become "latest" — they only ever sit in
              # the releases list. Without this gate v2.1.0-develop would
              # parse as [2,1,0] and promote past v2.1.0 stable.
              def parse_version(v):
                  core = v.lstrip('v').split('-', 1)[0]
                  parts = core.split('.')
                  return [int(x) for x in parts if x.isdigit()]

              def is_prerelease(v):
                  return '-' in v.lstrip('v')

              try:
                  if is_prerelease(version_name):
                      print(f"Skipping latestRelease update — {version_name} is a pre-release")
                  else:
                      current_latest = data.get('latestRelease')
                      if not current_latest:
                          data['latestRelease'] = version_name
                          print(f"Set latestRelease to: {version_name}")
                      elif parse_version(version_name) >= parse_version(current_latest):
                          data['latestRelease'] = version_name
                          print(f"Updated latestRelease to: {version_name}")
              except Exception as e:
                  print(f"Warning: Could not compare versions: {e}")
                  if not data.get('latestRelease') and not is_prerelease(version_name):
                      data['latestRelease'] = version_name
          
          else:
              branches = data.get('branches', {})
              
              if version_name not in branches:
                  branches[version_name] = {'commits': []}
                  print(f"Created new branch entry: {version_name}")
              
              commit_entry = {
                  'hash': commit_hash,
                  'date': commit_date,
                  'author': commit_author,
                  'message': commit_message
              }
              
              commits = branches[version_name]['commits']
              
              # Check if commit already exists
              existing_idx = next((i for i, c in enumerate(commits) if c['hash'] == commit_hash), None)
              
              if existing_idx is not None:
                  commits[existing_idx] = commit_entry
                  print(f"Updated existing commit: {commit_hash}")
              else:
                  # Add to beginning (newest first)
                  commits.insert(0, commit_entry)
                  print(f"Added new commit: {commit_hash}")
              
              max_commits = 50
              if len(commits) > max_commits:
                  commits = commits[:max_commits]
                  print(f"Trimmed commits to {max_commits}")
              
              branches[version_name]['commits'] = commits
              data['branches'] = branches
          
          with open('versions.json', 'w') as f:
              json.dump(data, f, indent=2)
          
          print("versions.json updated successfully")
          PYTHON_SCRIPT

      - name: Commit and push to docs branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          VERSION_TYPE="${{ needs.generate-docs.outputs.version_type }}"
          VERSION_NAME="${{ needs.generate-docs.outputs.version_name }}"
          COMMIT_HASH="${{ needs.generate-docs.outputs.commit_hash }}"
          
          git add .
          
          if [ "$VERSION_TYPE" == "release" ]; then
            COMMIT_MSG="docs: deploy release $VERSION_NAME"
          else
            COMMIT_MSG="docs: deploy $VERSION_NAME @ $COMMIT_HASH"
          fi
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "$COMMIT_MSG"
            # Push explicitly to docs branch, handling detached HEAD
            git push origin HEAD:${{ env.DOCS_BRANCH }}
            echo "----------------------------------------"
            echo "Deployed: $COMMIT_MSG"
            echo "----------------------------------------"
          fi
