name: SHACL validation

on:
  workflow_call:
  push:
    paths:
      - 'src/ontology/ontology-combined.ttl'
      - 'src/ontology/ontology-definitions.ttl'
      - 'src/ontology/ontology-enumerations.ttl'
      - 'src/ontology/ontology-shapes.ttl'
      - 'src/ontology/ontology-combined-verbose.ttl'
      - 'src/ontology/ontology-definitions-verbose.ttl'
      - 'src/ontology/ontology-enumerations-verbose.ttl'
      - 'src/ontology/ontology-shapes-verbose.ttl'
  pull_request:
    paths:
      - 'src/ontology/ontology-combined.ttl'
      - 'src/ontology/ontology-definitions.ttl'
      - 'src/ontology/ontology-enumerations.ttl'
      - 'src/ontology/ontology-shapes.ttl'
      - 'src/ontology/ontology-combined-verbose.ttl'
      - 'src/ontology/ontology-definitions-verbose.ttl'
      - 'src/ontology/ontology-enumerations-verbose.ttl'
      - 'src/ontology/ontology-shapes-verbose.ttl'
jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: SHACL validation (core)
        run: |
          uv run python tools/python/checks/shacl.py src/ontology/ontology-combined.ttl src/quality-checks/shacl-shacl.ttl

      - name: SHACL validation (verbose)
        run: |
          uv run python tools/python/checks/shacl.py src/ontology/ontology-combined-verbose.ttl src/quality-checks/shacl-shacl.ttl
