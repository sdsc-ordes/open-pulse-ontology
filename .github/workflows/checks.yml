name: SHACL validation

on:
  workflow_call:
  push:
    paths:
      - 'src/ontology/ontology-combined-canonical.ttl'
      - 'src/ontology/ontology-definitions-canonical.ttl'
      - 'src/ontology/ontology-enumerations-canonical.ttl'
      - 'src/ontology/ontology-shapes-canonical.ttl'
      - 'src/ontology/ontology-combined-raw.ttl'
      - 'src/ontology/ontology-definitions-raw.ttl'
      - 'src/ontology/ontology-enumerations-raw.ttl'
      - 'src/ontology/ontology-shapes-raw.ttl'
  pull_request:
    paths:
      - 'src/ontology/ontology-combined-canonical.ttl'
      - 'src/ontology/ontology-definitions-canonical.ttl'
      - 'src/ontology/ontology-enumerations-canonical.ttl'
      - 'src/ontology/ontology-shapes-canonical.ttl'
      - 'src/ontology/ontology-combined-raw.ttl'
      - 'src/ontology/ontology-definitions-raw.ttl'
      - 'src/ontology/ontology-enumerations-raw.ttl'
      - 'src/ontology/ontology-shapes-raw.ttl'
jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: SHACL validation (canonical)
        run: |
          uv run python tools/python/checks/shacl.py src/ontology/ontology-combined-canonical.ttl src/quality-checks/shacl-shacl.ttl

      - name: SHACL validation (raw)
        run: |
          uv run python tools/python/checks/shacl.py src/ontology/ontology-combined-raw.ttl src/quality-checks/shacl-shacl.ttl
