name: Publish Stable Release

on:
  push:
    branches:
      - main
    paths:
      - 'src/ontology/ontology-combined.ttl'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      pull-requests: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract Clean Version
        id: extract
        run: |
          VERSION=$(grep -oP 'owl:versionInfo\s+"v?\K[^"]+' src/ontology/ontology-combined.ttl | head -1)
          if [[ ! "$VERSION" =~ ^v ]]; then VERSION="v$VERSION"; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Extract latest release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Strips out old versions, leaving only the notes for THIS release
          git-cliff --tag "${{ steps.extract.outputs.version }}" --unreleased --strip all > release-notes.md

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          
          # Check if it exists to prevent failing
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION already exists. Skipping."
          else
            gh release create "$VERSION" \
              --title "Release $VERSION" \
              --notes-file release-notes.md \
              --latest
          fi