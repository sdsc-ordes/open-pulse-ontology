name: Prepare Production Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0 

      - name: Bump Version
        id: bump
        run: |
          CURRENT=$(grep -oP 'owl:versionInfo\s+"v?\K[^"]+' src/ontology/ontology-definitions-canonical.ttl | head -1)
          CLEAN=$(echo "$CURRENT" | sed 's/-.*//')
          if [[ ! "$CLEAN" =~ ^v ]]; then CLEAN="v$CLEAN"; fi

          # ontology-definitions-canonical.ttl is the source of truth; raw and provenance
          # each carry their own owl:Ontology header but are versioned in lockstep with it,
          # since all three are released together (see CONTRIBUTING.md Section 0).
          # ontology-combined-*.ttl are generated from these further down.
          sed -i "s|owl:versionInfo \"v\?$CURRENT\"|owl:versionInfo \"$CLEAN\"|" \
            src/ontology/ontology-definitions-canonical.ttl \
            src/ontology/ontology-definitions-raw.ttl \
            src/ontology/ontology-definitions-provenance.ttl
          echo "clean_version=$CLEAN" >> $GITHUB_OUTPUT

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Regenerate ontology-combined*.ttl
        run: uv run --no-project python tools/python/build/combine_ontology.py

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate Changelog
        run: |
          git-cliff --tag "${{ steps.bump.outputs.clean_version }}" --output CHANGELOG.md

      - name: Create PR to Main
        uses: peter-evans/create-pull-request@v8
        with:
          branch: release/${{ steps.bump.outputs.clean_version }}
          base: main
          title: "Release ${{ steps.bump.outputs.clean_version }}"
          commit-message: "chore(release): bump version and update changelog to ${{ steps.bump.outputs.clean_version }}"
          body: |
            This PR was automatically generated to promote the ontology from **develop** to **main**.
            
            ### 📦 Release Details
            - **New Version:** `${{ steps.bump.outputs.clean_version }}`
            - The `CHANGELOG.md` has been automatically generated using `git-cliff`.
            
            Merging this will trigger a **Stable Release** via the publish workflow.