name: Conversion

on:
  release:
    types:
      - published

jobs:
  conversion-nt:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps: 
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          git clone https://github.com/pchampin/sophia-cli
          cd sophia-cli
          cargo install --path .
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Convert ontology to N-Triples
        run: |
          sop parse src/ontology/ontology-combined-canonical.ttl ! serialize -o ontology-combined-canonical.nt
          sop parse src/ontology/ontology-combined-raw.ttl ! serialize -o ontology-combined-raw.nt
          sop parse src/ontology/ontology-combined-provenance.ttl ! serialize -o ontology-combined-provenance.nt

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" src/ontology/ontology-combined-canonical.ttl ontology-combined-canonical.nt src/ontology/ontology-combined-raw.ttl ontology-combined-raw.nt src/ontology/ontology-combined-provenance.ttl ontology-combined-provenance.nt --clobber
